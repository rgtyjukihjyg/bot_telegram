<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>История переписок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/static/style.css?v=3">
</head>
<body>
  <div id="screen-list" class="screen active">
    <div class="header">
      <div class="header-title">Чаты</div>
      <button id="theme-btn-list" class="theme-btn" title="Сменить тему">🌓</button>
    </div>
    <div id="chat-list" class="chat-list"></div>
    <div id="empty-state" class="empty-state" style="display:none">
      Пока нет сохранённых переписок
    </div>
  </div>

  <div id="screen-chat" class="screen">
    <div class="header chat-header">
      <button id="back-btn" class="back-btn">‹</button>
      <div class="chat-header-info">
        <div id="chat-title" class="chat-header-name">—</div>
        <div class="chat-header-sub">только просмотр</div>
      </div>
      <button id="theme-btn-chat" class="theme-btn" title="Сменить тему">🌓</button>
    </div>
    <div id="messages" class="messages"></div>
  </div>

  <script src="/app/static/app.js?v=3"></script>
</body>
</html>
